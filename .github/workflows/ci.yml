name: Validate BONES

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install --yes imagemagick librsvg2-bin
      - name: Build and test
        run: make test
      - name: Verify generated files are reproducible
        run: git diff --exit-code
